<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#050507; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="copilotHeaderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121217"/>
    </linearGradient>

    <!-- Padrão do Grid do Canvas -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#22222a"/>
    </pattern>

    <!-- Filtros de Sombra e Glow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Janela Principal -->
  <rect width="1200" height="680" rx="12" fill="url(#bgGrad)" stroke="#1f1f24" stroke-width="1.5"/>

  <!-- Top Bar / Window Controls -->
  <rect width="1200" height="32" rx="12" fill="#09090c"/>
  <rect y="20" width="1200" height="12" fill="#09090c"/>
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#1c1c22" stroke-width="1"/>
  <circle cx="20" cy="16" r="5" fill="#ef4444"/>
  <circle cx="36" cy="16" r="5" fill="#eab308"/>
  <circle cx="52" cy="16" r="5" fill="#22c55e"/>
  <text x="600" y="20" fill="#71717a" font-size="11" font-weight="500" text-anchor="middle">InfraGraph AI — Topology &amp; SRE Copilot</text>

  <!-- Header da Aplicação -->
  <rect y="32" width="1200" height="54" fill="#070708"/>
  <line x1="0" y1="86" x2="1200" y2="86" stroke="#1f1f23" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="44" width="30" height="30" rx="7" fill="url(#accentGrad)" filter="url(#emeraldGlow)"/>
  <path d="M 28 59 L 35 49 L 42 59 Z" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="35" cy="49" r="2" fill="#000000"/>
  <circle cx="28" cy="59" r="2" fill="#000000"/>
  <circle cx="42" cy="59" r="2" fill="#000000"/>

  <text x="58" y="58" fill="#f4f4f5" font-size="15" font-weight="700">InfraGraph</text>
  <text x="58" y="70" fill="#71717a" font-size="10">DevOps &amp; Topology Analyzer</text>

  <!-- Badges Informativos -->
  <rect x="230" y="47" width="105" height="24" rx="5" fill="#0e0e11" stroke="#1f1f23"/>
  <circle cx="242" cy="59" r="3" fill="#10b981"/>
  <text x="252" y="63" fill="#a1a1aa" font-size="11">Serviços: <tspan fill="#f4f4f5" font-weight="600">5</tspan></text>

  <rect x="345" y="47" width="150" height="24" rx="5" fill="#0e0e11" stroke="#1f1f23"/>
  <circle cx="357" cy="59" r="3" fill="#34d399"/>
  <text x="367" y="63" fill="#a1a1aa" font-size="11">Formato: <tspan fill="#f4f4f5" font-weight="600">Docker Compose</tspan></text>

  <!-- Botões de Ação -->
  <rect x="580" y="46" width="125" height="26" rx="5" fill="#0e0e11" stroke="#27272a"/>
  <polygon points="593,54 593,64 602,59" fill="#10b981"/>
  <text x="608" y="63" fill="#d4d4d8" font-size="11" font-weight="500">Carregar Exemplo</text>

  <rect x="715" y="46" width="105" height="26" rx="5" fill="#18181b" stroke="#27272a"/>
  <path d="M 728 62 L 728 55 M 725 58 L 728 55 L 731 58" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
  <text x="738" y="63" fill="#f4f4f5" font-size="11" font-weight="600">Upload YAML</text>

  <!-- Botão Copilot (Ativo) -->
  <rect x="830" y="46" width="100" height="26" rx="5" fill="#10b981" filter="url(#emeraldGlow)"/>
  <text x="880" y="63" fill="#000000" font-size="11" font-weight="700" text-anchor="middle">✨ Copiloto AI</text>

  <!-- ================= CANVAS DO REACTFLOW ================= -->
  <rect y="86" width="870" height="594" fill="#020203"/>
  <rect y="86" width="870" height="594" fill="url(#dotGrid)"/>

  <!-- ARESTAS / CONEXÕES (Edges) -->
  <!-- Nginx -> Web App -->
  <path d="M 195 240 L 195 280 L 140 280 L 140 330" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Nginx -> API Service -->
  <path d="M 230 240 L 230 290 L 350 290 L 350 330" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- API Service -> Postgres -->
  <path d="M 320 415 L 320 455 L 230 455 L 230 495" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- API Service -> Redis -->
  <path d="M 370 415 L 370 455 L 450 455 L 450 495" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- Conexões com Redes (Tracejado) -->
  <path d="M 140 180 L 140 145" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 350 180 L 350 145" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- NÓS DE REDE (Networks) -->
  <g transform="translate(60, 115)">
    <rect width="160" height="30" rx="15" fill="#0c0c0e" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" fill="#10b981" font-size="11" font-weight="600">Rede: frontend-net</text>
  </g>
  <g transform="translate(270, 115)">
    <rect width="160" height="30" rx="15" fill="#0c0c0e" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" fill="#10b981" font-size="11" font-weight="600">Rede: backend-net</text>
  </g>

  <!-- NÓ 1: Nginx Proxy -->
  <g transform="translate(110, 175)" filter="url(#cardShadow)">
    <rect width="190" height="68" rx="8" fill="#0c0c0e" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="7" fill="rgba(34, 197, 94, 0.15)"/>
    <circle cx="18" cy="22" r="3" fill="#22c55e"/>
    <text x="32" y="26" fill="#f4f4f5" font-size="12" font-weight="600">nginx-proxy</text>
    <text x="18" y="44" fill="#71717a" font-size="10" font-family="monospace">nginx:alpine</text>
    <rect x="18" y="50" width="70" height="14" rx="3" fill="#18181b" stroke="#27272a"/>
    <text x="23" y="61" fill="#34d399" font-size="9">Porta: 80, 443</text>
  </g>

  <!-- NÓ 2: Web App -->
  <g transform="translate(50, 335)" filter="url(#cardShadow)">
    <rect width="180" height="75" rx="8" fill="#0c0c0e" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="7" fill="rgba(74, 222, 128, 0.15)"/>
    <circle cx="18" cy="22" r="3" fill="#4ade80"/>
    <text x="32" y="26" fill="#f4f4f5" font-size="12" font-weight="600">web-app</text>
    <text x="18" y="44" fill="#71717a" font-size="10" font-family="monospace">node:18-alpine</text>
    <rect x="18" y="52" width="55" height="14" rx="3" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="23" y="63" fill="#34d399" font-size="9">2 Envs</text>
  </g>

  <!-- NÓ 3: API Service -->
  <g transform="translate(260, 335)" filter="url(#cardShadow)">
    <rect width="180" height="80" rx="8" fill="#0c0c0e" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="7" fill="rgba(16, 185, 129, 0.15)"/>
    <circle cx="18" cy="22" r="3" fill="#10b981"/>
    <text x="32" y="26" fill="#f4f4f5" font-size="12" font-weight="600">api-service</text>
    <text x="18" y="44" fill="#71717a" font-size="10" font-family="monospace">python:3.11-slim</text>
    <rect x="18" y="55" width="55" height="14" rx="3" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="23" y="66" fill="#34d399" font-size="9">2 Envs</text>
    <rect x="80" y="55" width="80" height="14" rx="3" fill="#18181b" stroke="#27272a"/>
    <text x="85" y="66" fill="#a1a1aa" font-size="9">depends_on: 2</text>
  </g>

  <!-- NÓ 4: Postgres DB (Selecionado / Glow) -->
  <g transform="translate(140, 500)" filter="url(#emeraldGlow)">
    <rect width="190" height="80" rx="8" fill="#0c0c0e" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="18" cy="22" r="7" fill="rgba(16, 185, 129, 0.25)"/>
    <circle cx="18" cy="22" r="3" fill="#10b981"/>
    <text x="32" y="26" fill="#f4f4f5" font-size="12" font-weight="700">postgres-db</text>
    <text x="18" y="44" fill="#71717a" font-size="10" font-family="monospace">postgres:15-alpine</text>
    <rect x="18" y="55" width="55" height="14" rx="3" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"/>
    <text x="23" y="66" fill="#34d399" font-size="9">2 Envs</text>
    <rect x="80" y="55" width="95" height="14" rx="3" fill="#18181b" stroke="#27272a"/>
    <text x="85" y="66" fill="#a1a1aa" font-size="9">Vol: db_data</text>
  </g>

  <!-- NÓ 5: Redis Cache -->
  <g transform="translate(360, 500)" filter="url(#cardShadow)">
    <rect width="170" height="75" rx="8" fill="#0c0c0e" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="7" fill="rgba(52, 211, 153, 0.15)"/>
    <circle cx="18" cy="22" r="3" fill="#34d399"/>
    <text x="32" y="26" fill="#f4f4f5" font-size="12" font-weight="600">redis-cache</text>
    <text x="18" y="44" fill="#71717a" font-size="10" font-family="monospace">redis:7-alpine</text>
    <rect x="18" y="53" width="70" height="14" rx="3" fill="#18181b" stroke="#27272a"/>
    <text x="23" y="64" fill="#34d399" font-size="9">Cache Node</text>
  </g>

  <!-- INSPECTOR MODAL (Canto inferior esquerdo) -->
  <g transform="translate(20, 530)" filter="url(#cardShadow)">
    <rect width="105" height="130" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <rect width="105" height="24" rx="8" fill="#121216"/>
    <text x="10" y="16" fill="#f4f4f5" font-size="9" font-weight="600">Inspetor</text>
    <text x="10" y="38" fill="#71717a" font-size="8">Tipo:</text>
    <text x="35" y="38" fill="#10b981" font-size="8" font-weight="600">database</text>
    <text x="10" y="55" fill="#71717a" font-size="8">Portas:</text>
    <text x="10" y="68" fill="#34d399" font-size="8">5432</text>
    <text x="10" y="85" fill="#71717a" font-size="8">Volumes:</text>
    <text x="10" y="98" fill="#e4e4e7" font-size="8">db_data</text>
  </g>

  <!-- CONTROLES DO REACTFLOW (Canto inferior esquerdo do canvas) -->
  <g transform="translate(560, 620)">
    <rect width="90" height="26" rx="6" fill="#0c0c0e" stroke="#27272a"/>
    <text x="15" y="18" fill="#71717a" font-size="14">+</text>
    <line x1="30" y1="0" x2="30" y2="26" stroke="#27272a"/>
    <text x="43" y="18" fill="#71717a" font-size="14">−</text>
    <line x1="60" y1="0" x2="60" y2="26" stroke="#27272a"/>
    <text x="73" y="17" fill="#71717a" font-size="12">⛶</text>
  </g>

  <!-- MINIMAP (Canto inferior direito do canvas) -->
  <g transform="translate(680, 540)" filter="url(#cardShadow)">
    <rect width="160" height="110" rx="8" fill="#050507" stroke="#1f1f23" stroke-width="1.2"/>
    <text x="10" y="16" fill="#52525b" font-size="8" font-weight="600">MINIMAP</text>
    <!-- Mini pontos dos nós -->
    <rect x="65" y="30" width="25" height="12" rx="2" fill="#22c55e" opacity="0.8"/>
    <rect x="35" y="50" width="22" height="12" rx="2" fill="#4ade80" opacity="0.8"/>
    <rect x="85" y="50" width="22" height="12" rx="2" fill="#059669" opacity="0.8"/>
    <rect x="50" y="75" width="25" height="12" rx="2" fill="#10b981" opacity="1"/>
    <rect x="95" y="75" width="22" height="12" rx="2" fill="#34d399" opacity="0.8"/>
    <rect x="20" y="20" width="120" height="75" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  </g>

  <!-- ================= SIDEBAR COPILOTO AI ================= -->
  <line x1="870" y1="86" x2="870" y2="680" stroke="#1f1f23" stroke-width="1"/>
  <rect x="870" y="86" width="330" height="594" fill="#050505"/>

  <!-- Copilot Header -->
  <rect x="870" y="86" width="330" height="44" fill="url(#copilotHeaderGrad)"/>
  <line x1="870" y1="130" x2="1200" y2="130" stroke="#1f1f23" stroke-width="1"/>
  <circle cx="890" cy="108" r="4" fill="#10b981"/>
  <text x="902" y="112" fill="#f4f4f5" font-size="12" font-weight="600">Copiloto AI de Infraestrutura</text>

  <!-- Abas (Auditoria vs Chat) -->
  <rect x="870" y="130" width="165" height="34" fill="#0e0e11"/>
  <text x="952" y="152" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Auditoria de IA</text>
  <line x1="870" y1="164" x2="1035" y2="164" stroke="#10b981" stroke-width="2"/>

  <rect x="1035" y="130" width="165" height="34" fill="#070708"/>
  <text x="1117" y="152" fill="#71717a" font-size="11" font-weight="600" text-anchor="middle">Chat Interativo</text>
  <line x1="870" y1="164" x2="1200" y2="164" stroke="#1f1f23" stroke-width="1"/>

  <!-- Conteúdo da Auditoria de IA -->
  <!-- Card 1: Resumo Executivo -->
  <g transform="translate(885, 180)">
    <rect width="300" height="70" rx="6" fill="#0e0e11" stroke="#1f1f23"/>
    <text x="12" y="20" fill="#10b981" font-size="11" font-weight="600">Resumo da Arquitetura</text>
    <text x="12" y="38" fill="#a1a1aa" font-size="10">Topologia de microserviços em 3 camadas</text>
    <text x="12" y="52" fill="#a1a1aa" font-size="10">com proxy reverso Nginx, backend Node/Python</text>
    <text x="12" y="66" fill="#a1a1aa" font-size="10">e persistência em PostgreSQL e Redis.</text>
  </g>

  <!-- Card 2: SPOF -->
  <g transform="translate(885, 260)">
    <rect width="300" height="92" rx="6" fill="#0e0e11" stroke="#27272a"/>
    <text x="12" y="20" fill="#f4f4f5" font-size="11" font-weight="600">⚠️ Pontos Únicos de Falha (SPOF)</text>
    <circle cx="18" cy="38" r="2" fill="#10b981"/>
    <text x="26" y="42" fill="#a1a1aa" font-size="10">Postgres sem réplica de leitura configurada.</text>
    <circle cx="18" cy="56" r="2" fill="#10b981"/>
    <text x="26" y="60" fill="#a1a1aa" font-size="10">Ponto único de entrada no proxy sem HA.</text>
    <circle cx="18" cy="74" r="2" fill="#10b981"/>
    <text x="26" y="78" fill="#a1a1aa" font-size="10">Redis em instância única (sem Sentinel/Cluster).</text>
  </g>

  <!-- Card 3: Riscos de Segurança -->
  <g transform="translate(885, 362)">
    <rect width="300" height="78" rx="6" fill="#0e0e11" stroke="#27272a"/>
    <text x="12" y="20" fill="#f4f4f5" font-size="11" font-weight="600">🛡️ Riscos de Segurança</text>
    <circle cx="18" cy="38" r="2" fill="#34d399"/>
    <text x="26" y="42" fill="#a1a1aa" font-size="10">Senha do Postgres declarada em plaintext.</text>
    <circle cx="18" cy="56" r="2" fill="#34d399"/>
    <text x="26" y="60" fill="#a1a1aa" font-size="10">Recomenda-se uso de Docker Secrets ou Vault.</text>
  </g>

  <!-- Card 4: Recomendações -->
  <g transform="translate(885, 450)">
    <rect width="300" height="96" rx="6" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.25)"/>
    <text x="12" y="20" fill="#10b981" font-size="11" font-weight="600">💡 Recomendações de Alta Disponibilidade</text>
    <circle cx="18" cy="38" r="2" fill="#10b981"/>
    <text x="26" y="42" fill="#d1fae5" font-size="10">Configurar healthchecks em todos os serviços.</text>
    <circle cx="18" cy="56" r="2" fill="#10b981"/>
    <text x="26" y="60" fill="#d1fae5" font-size="10">Adicionar réplica de leitura para o PostgreSQL.</text>
    <circle cx="18" cy="74" r="2" fill="#10b981"/>
    <text x="26" y="78" fill="#d1fae5" font-size="10">Utilizar balanceador L4/L7 antes do Nginx.</text>
  </g>

  <!-- Botão de Re-análise no Copilot -->
  <g transform="translate(885, 560)">
    <rect width="300" height="34" rx="6" fill="#10b981" filter="url(#emeraldGlow)"/>
    <text x="1035" y="582" fill="#000000" font-size="11" font-weight="700" text-anchor="middle">✨ Atualizar Análise com Gemini</text>
  </g>

  <!-- Rodapé do Copilot / Powered by Gemini -->
  <text x="1035" y="640" fill="#71717a" font-size="10" text-anchor="middle">Powered by Google Gemini 2.0 &amp; InfraGraph Engine</text>
</svg>
