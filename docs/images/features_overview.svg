<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" style="background:#07070a; border-radius:10px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e13"/>
      <stop offset="100%" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: Multi-IaC Parsing -->
  <g transform="translate(25, 25)">
    <rect width="295" height="270" rx="8" fill="url(#cardGrad)" stroke="#1f1f26" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="40" y="46" font-size="20" text-anchor="middle">📦</text>
    <text x="20" y="85" fill="#f4f4f5" font-size="15" font-weight="700">1. Ingestão Multi-IaC</text>
    <text x="20" y="105" fill="#71717a" font-size="11">Suporte nativo aos formatos padrão da indústria:</text>

    <!-- Badges de formatos -->
    <g transform="translate(20, 125)">
      <rect width="125" height="26" rx="5" fill="#14141a" stroke="#272733"/>
      <text x="12" y="17" fill="#10b981" font-size="11" font-weight="600">🐳 Docker Compose</text>
      
      <rect x="135" width="115" height="26" rx="5" fill="#14141a" stroke="#272733"/>
      <text x="147" y="17" fill="#38bdf8" font-size="11" font-weight="600">☸️ Kubernetes</text>

      <rect y="36" width="125" height="26" rx="5" fill="#14141a" stroke="#272733"/>
      <text x="12" y="53" fill="#a855f7" font-size="11" font-weight="600">🟣 Terraform (.tf)</text>
    </g>

    <text x="20" y="210" fill="#a1a1aa" font-size="11" line-height="1.4">
      <tspan x="20" dy="0">• Extração automática de portas e envs</tspan>
      <tspan x="20" dy="18">• Mapeamento de redes e volumes</tspan>
      <tspan x="20" dy="18">• Relacionamento de dependências IaC</tspan>
    </text>
  </g>

  <!-- CARD 2: Interactive Topology -->
  <g transform="translate(350, 25)">
    <rect width="295" height="270" rx="8" fill="url(#cardGrad)" stroke="#1f1f26" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="40" y="46" font-size="20" text-anchor="middle">🗺️</text>
    <text x="20" y="85" fill="#f4f4f5" font-size="15" font-weight="700">2. Grafo Interativo</text>
    <text x="20" y="105" fill="#71717a" font-size="11">Visualização moderna com ReactFlow:</text>

    <!-- Mini visual -->
    <g transform="translate(20, 125)">
      <rect width="255" height="60" rx="6" fill="#030304" stroke="#1f1f24"/>
      <!-- Conexão animada -->
      <line x1="60" y1="30" x2="195" y2="30" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
      <!-- Nó Origem -->
      <rect x="15" y="14" width="70" height="32" rx="4" fill="#0e0e12" stroke="#272730"/>
      <text x="50" y="34" fill="#f4f4f5" font-size="10" font-weight="600" text-anchor="middle">api-service</text>
      <!-- Nó Destino -->
      <rect x="165" y="14" width="75" height="32" rx="4" fill="#0e0e12" stroke="#10b981"/>
      <text x="202" y="34" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">postgres-db</text>
    </g>

    <text x="20" y="215" fill="#a1a1aa" font-size="11">
      <tspan x="20" dy="0">• Nós customizados com ícones por serviço</tspan>
      <tspan x="20" dy="18">• MiniMap inteligente e navegação pan/zoom</tspan>
      <tspan x="20" dy="18">• Modal Inspetor com detalhes e configurações</tspan>
    </text>
  </g>

  <!-- CARD 3: AI SRE Copilot -->
  <g transform="translate(675, 25)">
    <rect width="295" height="270" rx="8" fill="url(#cardGrad)" stroke="#1f1f26" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="40" y="46" font-size="20" text-anchor="middle">🤖</text>
    <text x="20" y="85" fill="#f4f4f5" font-size="15" font-weight="700">3. Copiloto AI (Gemini)</text>
    <text x="20" y="105" fill="#71717a" font-size="11">Inteligência contextual para DevOps e SRE:</text>

    <!-- Mini visual -->
    <g transform="translate(20, 125)">
      <rect width="255" height="60" rx="6" fill="#030304" stroke="#1f1f24"/>
      <rect x="10" y="10" width="235" height="18" rx="3" fill="#121218"/>
      <text x="18" y="23" fill="#10b981" font-size="9" font-weight="600">⚠️ SPOF: Ponto Único de Falha no Banco</text>
      <rect x="10" y="32" width="235" height="18" rx="3" fill="rgba(16, 185, 129, 0.08)"/>
      <text x="18" y="45" fill="#34d399" font-size="9" font-weight="500">💡 Sugestão: Configurar réplica Read-Only</text>
    </g>

    <text x="20" y="215" fill="#a1a1aa" font-size="11">
      <tspan x="20" dy="0">• Auditoria de falhas em cascata</tspan>
      <tspan x="20" dy="18">• Análise de vulnerabilidades de segurança</tspan>
      <tspan x="20" dy="18">• Chat interativo sobre a infraestrutura</tspan>
    </text>
  </g>
</svg>
